button:focus-visible, input:focus-visible, select:focus-visible { outline: 2px solid #0E7C86; outline-offset: 2px; }
@media (max-width: 720px) {
  .ebc-grid { grid-template-columns: 1fr !important; }

@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
/* ===== v3.0 add-on: red flags, report / voice intake, treatment scenario ===== */
.kx-sr { position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
.kx-card { background: #fff; border: 1px solid #DDE5EE; border-radius: 12px; padding: 14px 16px; margin-bottom: 14px; color: #14243B; font-family: inherit; min-width: 0; box-sizing: border-box; }
.kx-card h2, .kx-card h3, .kx-card h4 { margin: 0; }
.kx-eyebrow { font-size: 10.5px; font-weight: 800; letter-spacing: .06em; color: #6B7C90; text-transform: uppercase; margin-bottom: 7px; }
.kx-small { font-size: 12px; line-height: 1.55; color: #4A5A6E; margin: 3px 0 0; }
.kx-muted { color: #8798AB; }
.kx-mini { font-size: 10.5px; font-weight: 800; letter-spacing: .05em; color: #6B7C90; text-transform: uppercase; margin: 8px 0 4px; }
.kx-mini.kx-inl { display: inline; margin: 0 4px 0 0; }
.kx-mini-c { color: #B45309; }

/* buttons and links */
.kx-btn { padding: 8px 14px; border-radius: 8px; border: 1.5px solid #DDE5EE; background: #fff; color: #14243B; font-family: inherit; font-weight: 700; font-size: 12.5px; line-height: 1.25; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; }
.kx-btn:hover:not(:disabled) { border-color: #0E7C86; }
.kx-btn.kx-pri { background: #0E7C86; border-color: #0E7C86; color: #fff; }
.kx-btn.kx-red { background: #DC2626; border-color: #DC2626; color: #fff; }
.kx-btn.kx-on { background: #E6F5F6; border-color: #0E7C86; color: #0A5E66; }
.kx-btn:disabled { opacity: .55; cursor: default; }
.kx-btn[aria-disabled="true"] { opacity: .55; cursor: default; }
.kx-link { background: none; border: none; padding: 2px 0; color: #0A5E66; font-family: inherit; font-weight: 700; font-size: 12px; text-decoration: underline; cursor: pointer; }
.kx-link:disabled { opacity: .5; cursor: default; }
.kx-btn:focus-visible, .kx-link:focus-visible, .kx-ta:focus-visible, .kx-up input:focus-visible { outline: 3px solid #5EEAD4; outline-offset: 1px; }
.kx-row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin: 0 0 8px; }
.kx-row.kx-end { margin-top: 10px; }

/* intake */
.kx-intake { border-top: 4px solid #0E7C86; }
.kx-intake.kx-live { border-color: #0E7C86; box-shadow: 0 0 0 3px rgba(14,124,134,.16); }
.kx-intake.kx-drag { background: #F2FAFB; border-style: dashed; border-color: #0E7C86; }
.kx-ih { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; margin-bottom: 10px; }
.kx-ih b { display: block; font-size: 14px; font-weight: 800; }
.kx-ih span { display: block; font-size: 12px; color: #4A5A6E; margin-top: 2px; line-height: 1.5; }
.kx-tip { margin: 0 0 8px; font-size: 11.5px; color: #4A5A6E; line-height: 1.5; }
.kx-ta { display: block; width: 100%; box-sizing: border-box; min-height: 64px; max-height: 260px; padding: 10px 12px; border: 1.5px solid #DDE5EE; border-radius: 9px; font-family: inherit; font-size: 13.5px; line-height: 1.5; color: #14243B; resize: vertical; background: #fff; overflow-y: auto; }
.kx-busy { display: flex; align-items: center; gap: 8px; font-size: 12px; color: #0A5E66; font-weight: 700; margin: 0 0 8px; flex-wrap: wrap; }
.kx-spin { width: 14px; height: 14px; border: 2px solid #9FD3D6; border-top-color: #0E7C86; border-radius: 50%; animation: kxspin .8s linear infinite; flex: none; }
@keyframes kxspin { to { transform: rotate(360deg); } }
.kx-files { list-style: none; margin: 0 0 8px; padding: 0; display: grid; gap: 4px; }
.kx-files li { display: flex; gap: 8px; align-items: baseline; font-size: 12px; min-width: 0; flex-wrap: wrap; }
.kx-files .kx-ic { font-weight: 800; }
.kx-fok .kx-ic { color: #166534; }
.kx-fbad .kx-ic { color: #B91C1C; }
.kx-nm { font-weight: 700; overflow-wrap: anywhere; }
.kx-kd { color: #6B7C90; }
.kx-note-in { margin: 0 0 8px; font-size: 12px; line-height: 1.5; color: #92400E; background: #FFFBEB; border: 1px solid #FCD34D; border-radius: 8px; padding: 7px 10px; }
.kx-live-strip { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; margin-top: 10px; padding: 8px 12px; border-radius: 9px; font-size: 12.5px; font-weight: 700; line-height: 1.45; }
.kx-ls-red { background: #FEF2F2; border: 1.5px solid #DC2626; color: #991B1B; }
.kx-ls-green { background: #F0FDF4; border: 1.5px solid #86EFAC; color: #166534; }
.kx-ls-info { background: #EEF6FB; border: 1px solid #B6D4EA; color: #14243B; }
.kx-ls-warn { background: #FFFBEB; border: 1.5px solid #F59E0B; color: #92400E; }
.kx-heard { margin-top: 8px; }
.kx-chips { display: flex; flex-wrap: wrap; gap: 6px; }
.kx-chip { background: #E6F5F6; color: #0A5E66; border: 1px solid #9FD3D6; border-radius: 20px; padding: 3px 10px; font-size: 11.5px; font-weight: 700; }
.kx-chip.kx-flag { background: #FEE2E2; color: #991B1B; border-color: #FCA5A5; }
.kx-chip.kx-assumed { background: #FFFBEB; color: #92400E; border-color: #FCD34D; }
.kx-chip.kx-missing { background: #F1F5F9; color: #4A5A6E; border-color: #CBD5E1; font-weight: 600; }
.kx-warn { margin: 6px 0 0; font-size: 12px; line-height: 1.5; color: #92400E; }
.kx-acts { display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: center; margin-top: 8px; }
.kx-priv { margin: 10px 0 0; font-size: 11px; line-height: 1.55; color: #6B7C90; }

/* red flags and pathway notes */
.kx-rfs { margin: 0 0 12px; }
.kx-rf { background: #FEF2F2; border: 2px solid #DC2626; border-left-width: 7px; border-radius: 10px; padding: 12px 14px; margin: 0 0 12px; color: #7F1D1D; }
.kx-rf-h { display: flex; gap: 10px; align-items: flex-start; margin-bottom: 6px; }
.kx-rf-ic { font-size: 22px; line-height: 1; }
.kx-rf-k { font-size: 10.5px; font-weight: 900; letter-spacing: .1em; color: #B91C1C; }
.kx-rf h3 { font-size: 14.5px; font-weight: 800; line-height: 1.35; color: #991B1B; }
.kx-rf-p { margin: 4px 0 6px; font-size: 12.5px; line-height: 1.55; color: #7F1D1D; }
.kx-up { display: flex; gap: 8px; align-items: flex-start; font-size: 11.5px; line-height: 1.45; color: #4A5A6E; margin-top: 8px; cursor: pointer; }
.kx-up input { margin-top: 2px; flex: none; }
.kx-ok { background: #F0FDF4; border: 1.5px solid #86EFAC; border-radius: 10px; padding: 10px 14px; margin: 0 0 12px; font-size: 12.5px; line-height: 1.55; color: #166534; }
.kx-info { background: #EEF6FB; border: 1px solid #B6D4EA; border-radius: 10px; padding: 10px 14px; margin: 0 0 12px; font-size: 12.5px; line-height: 1.55; color: #14243B; }
.kx-warnbox { background: #FFFBEB; border: 1.5px solid #F59E0B; border-radius: 10px; padding: 10px 14px; margin: 0 0 12px; font-size: 12.5px; line-height: 1.55; color: #92400E; }
.kx-stagehint { font-size: 11px; line-height: 1.45; color: #6B7C90; margin: 6px 0 0; }
.kx-stagehint.kx-sh-warn { color: #92400E; background: #FFFBEB; border: 1px solid #F59E0B; border-radius: 6px; padding: 5px 8px; }

/* scenario */
.kx-scn-title { font-size: 20px; font-weight: 800; letter-spacing: -.01em; margin: 0 0 2px; }
.kx-verdict { margin: 10px 0 12px; padding: 9px 12px; border-radius: 9px; background: #EEF6FB; border: 1px solid #B6D4EA; font-size: 12.5px; line-height: 1.55; font-weight: 600; }
.kx-verdict.kx-vmust { background: #F3F7FD; border: 1.5px solid #14243B; color: #14243B; }
.kx-step .kx-eyebrow { color: #14243B; }
.kx-item { border: 1px solid #DDE5EE; border-left: 4px solid #0E7C86; border-radius: 9px; padding: 10px 12px; margin: 0 0 8px; background: #fff; }
.kx-item.kx-must { border-left-color: #14243B; border: 1.5px solid #14243B; border-left-width: 4px; background: #F3F7FD; }
.kx-item.kx-bad { border-color: #FCA5A5; border-left-color: #DC2626; background: #FEF2F2; }
.kx-item.kx-bad .kx-item-t { color: #991B1B; }
.kx-item.kx-bad .kx-note { color: #B91C1C; }
.kx-item-h { display: flex; gap: 8px; align-items: flex-start; flex-wrap: wrap; margin-bottom: 5px; }
.kx-item-t { font-weight: 700; font-size: 13.2px; line-height: 1.4; flex: 1; min-width: 180px; }
.kx-tier { color: #fff; border-radius: 4px; padding: 2px 8px; font-size: 9.5px; font-weight: 800; white-space: nowrap; }
.kx-trials { display: flex; gap: 6px; flex-wrap: wrap; margin: 0 0 6px; }
.kx-note { margin: 0 0 6px; font-size: 12px; line-height: 1.5; color: #4A5A6E; }
.kx-inplan { display: inline-block; font-size: 11px; font-weight: 700; color: #065F46; background: #ECFDF5; border: 1px solid #10B981; border-radius: 5px; padding: 2px 8px; margin-right: 8px; }
.kx-alt { margin-top: 4px; font-size: 12px; color: #4A5A6E; }
.kx-alt summary { cursor: pointer; font-weight: 700; color: #0A5E66; }
.kx-alt ul { margin: 6px 0 0; padding-left: 18px; display: grid; gap: 4px; list-style: disc; }
.kx-alt li { display: list-item; }
.kx-list { margin: 0; padding-left: 18px; display: grid; gap: 5px; font-size: 12.5px; line-height: 1.55; color: #4A5A6E; list-style: disc; }
.kx-list li { display: list-item; }
.kx-elig { border: 1px solid #DDE5EE; border-left: 4px solid #CBD5E1; border-radius: 9px; padding: 10px 12px; margin: 0 0 8px; }
.kx-elig.kx-elig-ok { border-left-color: #0E7C86; border-color: #9FD3D6; }
.kx-pill { background: #94A3B8; color: #fff; border-radius: 5px; padding: 2px 9px; font-size: 10.5px; font-weight: 800; white-space: nowrap; }
.kx-pill.kx-pill-ok { background: #0E7C86; }
.kx-co { background: #FFFBEB; border: 1.5px solid #FCD34D; border-radius: 9px; padding: 9px 12px; margin: 0 0 8px; color: #92400E; font-size: 12.5px; }
.kx-co.kx-co-avoid { background: #FEF2F2; border-color: #FCA5A5; color: #991B1B; }
.kx-co .kx-small { color: inherit; }
.kx-ae { border-top: 1px solid #EEF2F7; padding: 8px 0; }
.kx-ae:first-of-type { border-top: none; }
.kx-cover { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 10px; }
.kx-cv { border: 1px solid #DDE5EE; border-radius: 9px; padding: 10px 12px; min-width: 0; }
.kx-cv h4 { font-size: 13px; font-weight: 800; }
.kx-toast { font-size: 12px; font-weight: 700; color: #065F46; }
.kx-copybox { display: block; width: 100%; box-sizing: border-box; min-height: 240px; margin-top: 8px; padding: 10px; border: 1.5px solid #DDE5EE; border-radius: 9px; font: 12px/1.5 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; color: #14243B; background: #F8FAFC; }
.kx-foot { max-width: 940px; margin: 0 auto; padding: 4px 16px 28px; font-size: 11px; line-height: 1.6; color: #6B7C90; text-align: center; box-sizing: border-box; }

@media (max-width: 640px) {
  .kx-ta { font-size: 16px; }
  .kx-btn { padding: 9px 12px; }
  .kx-card, .kx-rf { padding-left: 12px; padding-right: 12px; }
}
@media (prefers-reduced-motion: reduce) {
  .kx-spin { animation: none; }
}

/* ---- v3.2: treatment plan summary — button fixed at the bottom, one-screen sheet ---- */
.kx-dock { position: fixed; left: 0; right: 0; bottom: 0; z-index: 80; display: flex; justify-content: center; padding: 0 16px calc(12px + env(safe-area-inset-bottom, 0px)); pointer-events: none; box-sizing: border-box; }
.kx-dock-btn { pointer-events: auto; display: inline-flex; align-items: center; justify-content: center; gap: 8px; max-width: 100%; border: 0; border-radius: 999px; background: #14243B; color: #fff; font-family: inherit; font-weight: 800; font-size: 14px; line-height: 1.2; padding: 12px 20px; box-shadow: 0 8px 24px rgba(20,36,59,.38); cursor: pointer; }
.kx-dock-btn:hover { background: #0E7C86; }
.kx-dock-btn:focus-visible { outline: 3px solid #5EEAD4; outline-offset: 2px; }
.kx-dock-n { background: #DC2626; color: #fff; border-radius: 999px; padding: 2px 8px; font-size: 11px; font-weight: 800; white-space: nowrap; }
.kx-dock-pad { height: calc(66px + env(safe-area-inset-bottom, 0px)); }
.kx-sheet-bg { position: fixed; inset: 0; z-index: 120; background: rgba(20,36,59,.55); display: flex; align-items: flex-end; justify-content: center; }
.kx-sheet { background: #fff; color: #14243B; width: 100%; max-width: 680px; max-height: 90vh; max-height: 90dvh; display: flex; flex-direction: column; border-radius: 16px 16px 0 0; box-shadow: 0 -12px 40px rgba(0,0,0,.3); box-sizing: border-box; overflow: hidden; font-family: inherit; }
.kx-sheet-h { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; padding: 14px 16px 10px; border-bottom: 1px solid #DDE5EE; }
.kx-sheet-h .kx-eyebrow { margin-bottom: 2px; }
.kx-sheet-h h2 { margin: 0; font-size: 20px; font-weight: 800; letter-spacing: -.01em; }
.kx-x { flex: none; width: 36px; height: 36px; border-radius: 50%; border: 1.5px solid #DDE5EE; background: #fff; color: #14243B; font-size: 15px; line-height: 1; cursor: pointer; font-family: inherit; }
.kx-x:hover { border-color: #0E7C86; }
.kx-x:focus-visible { outline: 3px solid #5EEAD4; outline-offset: 1px; }
.kx-sheet-b { padding: 12px 16px 14px; overflow-y: auto; overscroll-behavior: contain; flex: 1 1 auto; min-height: 0; }
.kx-sheet-b > .kx-verdict { margin-top: 8px; }
.kx-sheet-f { position: relative; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 10px 16px calc(10px + env(safe-area-inset-bottom, 0px)); border-top: 1px solid #DDE5EE; background: #F8FAFC; }
.kx-sheet-f .kx-toast { position: absolute; right: 16px; bottom: calc(100% + 8px); background: #14243B; color: #5EEAD4; padding: 6px 12px; border-radius: 8px; box-shadow: 0 6px 18px rgba(0,0,0,.25); }
.kx-sheet-f .kx-toast:empty { display: none; }
.kx-ss-eb { margin-top: 14px; margin-bottom: 2px; }

/* ---- print sheet: shared by the in-page print and the saved print-ready file ---- */
#kx-print-root, #kx-print-root * { all: revert; box-sizing: border-box; }
#kx-print-root { display: block; font-family: "Segoe UI", system-ui, -apple-system, "Helvetica Neue", Arial, "Noto Sans", sans-serif; font-size: 9.6pt; line-height: 1.4; color: #14202b; background: #fff; text-align: start; overflow-wrap: anywhere; orphans: 2; widows: 2; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
#kx-print-root h1 { display: block; margin: 0; font-size: 16pt; line-height: 1.15; font-weight: 800; letter-spacing: .02em; color: #14243b; }
#kx-print-root h1::before { content: "ALKADY ONCOLOGY CENTER"; display: block; margin-bottom: 3pt; font-size: 7.5pt; font-weight: 700; letter-spacing: .16em; color: #0b6c76; }
#kx-print-root .kxp-sub { display: block; margin: 2pt 0 0; padding-bottom: 6pt; border-bottom: 2pt solid #0b6c76; font-size: 10pt; font-weight: 600; letter-spacing: .03em; color: #4a5a6a; }
#kx-print-root h2 { display: block; margin: 11pt 0 0; padding-bottom: 2pt; border-bottom: .75pt solid #c5d3da; font-size: 10.5pt; font-weight: 800; letter-spacing: .05em; color: #0b6c76; break-after: avoid; page-break-after: avoid; }
#kx-print-root h3 { display: block; margin: 9pt 0 1pt; font-size: 10.5pt; font-weight: 800; color: #14243b; break-after: avoid; page-break-after: avoid; }
#kx-print-root p { display: block; margin: 2.5pt 0 0; }
#kx-print-root .kxp-in { margin-left: 4mm; }
#kx-print-root .kxp-lead { margin-top: 5pt; font-size: 11.5pt; font-weight: 800; line-height: 1.3; color: #14243b; }
#kx-print-root .kxp-note { margin-top: 1pt; font-size: 9pt; font-style: italic; color: #5a6b7a; }
#kx-print-root b { font-weight: 700; color: #14243b; }
#kx-print-root ul { display: block; margin: 3pt 0 0; padding: 0; list-style: none; }
#kx-print-root ul.kxp-l2 { margin-left: 6mm; }
#kx-print-root li { display: block; position: relative; margin: 0 0 2pt; padding-left: 4.5mm; break-inside: avoid; page-break-inside: avoid; }
#kx-print-root li::before { content: "•"; position: absolute; left: 1.2mm; top: 0; font-weight: 800; color: #0b6c76; }
#kx-print-root li.kxp-rfi { padding: 2pt 4pt 2pt 4.5mm; border-left: 2.5pt solid #b3261a; background: #fdf0ee; }
#kx-print-root li.kxp-rfi::before { left: 1.4mm; top: 2pt; color: #b3261a; }
#kx-print-root li.kxp-cai { padding: 2pt 4pt 2pt 4.5mm; border-left: 2.5pt solid #b26a00; background: #fff6e6; }
#kx-print-root li.kxp-cai::before { left: 1.4mm; top: 2pt; color: #b26a00; }
#kx-print-root .kxp-cont { display: block; margin-top: 1pt; font-size: 9pt; line-height: 1.38; color: #34495a; }
#kx-print-root .kxp-tag { display: inline-block; margin: 0 1pt; padding: .4pt 4pt; border: .75pt solid #7a8a98; border-radius: 2pt; font-size: 7.5pt; font-weight: 800; letter-spacing: .05em; text-transform: uppercase; line-height: 1.3; vertical-align: .6pt; white-space: nowrap; color: #3b4d5c; }
#kx-print-root .kxp-t-red { border-color: #b3261a; background: #b3261a; color: #fff; }
#kx-print-root .kxp-t-amb { border-color: #b26a00; background: #fff1d6; color: #7a4800; }
#kx-print-root .kxp-t-must { border-color: #14243b; background: #14243b; color: #fff; }
#kx-print-root .kxp-t-ok { border-color: #1b7a4c; background: #e4f3ea; color: #125c38; }
#kx-print-root .kxp-sym { font-weight: 800; }
#kx-print-root .kxp-c-ok .kxp-sym { color: #1b7a4c; }
#kx-print-root .kxp-c-warn .kxp-sym { color: #b26a00; }
#kx-print-root .kxp-c-no .kxp-sym { color: #b3261a; }
#kx-print-root .kxp-c-no { color: #8a1c12; }
#kx-print-root .kxp-foot { margin-top: 3pt; font-size: 8pt; line-height: 1.4; color: #5a6b7a; }
#kx-print-root .kxp-foot-first { margin-top: 14pt; padding-top: 5pt; border-top: .75pt solid #c5d3da; }
#kx-print-root .kxp-foot b { color: inherit; font-weight: 700; }

/* ---- in-page print: the sheet is invisible on screen and is the only thing the printer gets ---- */
#kx-print-root { display: none !important; }
@page { margin: 12mm 13mm 13mm; }
@media print {
  body.kx-printing > *:not(#kx-print-root) { display: none !important; }
  body.kx-printing { margin: 0 !important; padding: 0 !important; height: auto !important; min-height: 0 !important; overflow: visible !important; background: #fff !important; }
  html.kx-printing { height: auto !important; overflow: visible !important; background: #fff !important; color-scheme: light !important; }
  body.kx-printing > #kx-print-root { display: block !important; }
}

/* ===== v3.4: two-pane one-screen shell + ESMO 2026 / ASCO 2026 update colours ===== */
:root { --ff: 'Inter', -apple-system, 'Segoe UI', Roboto, Arial, sans-serif; }
html, body { background: #fff; }
.kx-hide { display: none !important; }
/* source colours (ESMO atlas palette): burgundy = ESMO 2026, light green = ASCO 2026, dark green = FDA / NCCN v9.2026 */
.kx-s-esmo { --c: #81134E; --t: #F8E8F0; --i: #5B0E37; }
.kx-s-asco { --c: #78821D; --t: #EEF4DE; --i: #3F4A12; }
.kx-s-fda  { --c: #1B4F26; --t: #E3EFE5; --i: #123A1B; }

.kx-app { background: #fff; color: #14243B; font-family: 'Inter', -apple-system, 'Segoe UI', Roboto, Arial, sans-serif; }
.kx-hdr { background: linear-gradient(135deg, #0A5E66, #14243B); color: #fff; padding: 8px 14px 8px; flex: 0 0 auto; }
.kx-hdr-top { display: flex; align-items: center; gap: 8px 18px; flex-wrap: wrap; }
.kx-hdr-id { display: flex; align-items: center; gap: 8px; background: rgba(94,234,212,.12); border: 1px solid rgba(94,234,212,.3); border-radius: 8px; padding: 4px 10px; }
.kx-hdr-id b { display: block; font-size: 12.5px; font-weight: 800; color: #5EEAD4; line-height: 1.25; }
.kx-hdr-id small { display: block; font-size: 10px; color: #9DBFC2; line-height: 1.25; }
.kx-hdr-ti { min-width: 0; }
.kx-hdr-ti h1 { margin: 0; font-size: 17px; font-weight: 800; letter-spacing: -.02em; line-height: 1.2; }
.kx-hdr-ti p { margin: 1px 0 0; font-size: 11px; color: #9DBFC2; line-height: 1.35; }
.kx-hdr-dots { display: inline-flex; gap: 5px; align-items: center; margin-left: 4px; }
.kx-hdr-dots i { width: 9px; height: 9px; border-radius: 50%; display: inline-block; border: 1.5px solid #fff; }
.kx-tabs { display: flex; gap: 5px; flex-wrap: wrap; margin-top: 7px; }
.kx-tabs button { padding: 4px 10px; border-radius: 6px; border: 1.5px solid #2C4A52; background: transparent; color: #9DBFC2; font: 600 12px/1.3 var(--ff); cursor: pointer; }
.kx-tabs button.kx-on { border-color: #5EEAD4; background: rgba(94,234,212,.15); color: #5EEAD4; }
.kx-tabs button.kx-upd-tab { border-color: #E9B3CE; }
.kx-pswitch { display: none; }
.kx-body { background: #fff; }
.kx-pane-l, .kx-pane-r { background: #fff; box-sizing: border-box; }

@media (min-width: 900px) {
  .kx-app { height: 100vh; height: 100dvh; display: flex; flex-direction: column; overflow: hidden; }
  .kx-body { flex: 1 1 auto; min-height: 0; display: grid; grid-template-columns: minmax(340px, 400px) minmax(0, 1fr); }
  .kx-pane { min-height: 0; overflow-y: auto; overscroll-behavior: contain; scrollbar-gutter: stable; }
  .kx-pane-l { border-right: 1px solid #DDE5EE; padding: 10px 12px 16px; }
  .kx-pane-r { padding: 12px 18px 70px; }
  .kx-dock { left: auto; right: 24px; bottom: 14px; padding: 0; justify-content: flex-end; }
  .kx-dock-pad { display: none; }
  .kx-app .kx-foot { flex: 0 0 auto; max-width: none; width: 100%; margin: 0; padding: 4px 14px; border-top: 1px solid #DDE5EE; background: #fff; display: flex; flex-wrap: wrap; justify-content: center; gap: 0 16px; font-size: 10.5px; line-height: 1.4; }
  .kx-app .kx-foot div:nth-child(2) { display: none; }
}
.kx-lgrid { display: flex; flex-direction: column; }
.kx-lcol { display: contents; }
@media (min-width: 1440px) {
  .kx-body { grid-template-columns: clamp(600px, 37vw, 680px) minmax(0, 1fr); }
  .kx-lgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 0 10px; align-items: start; }
  .kx-lcol { display: block; min-width: 0; }
}
@media (max-width: 899px) {
  .kx-app { min-height: 100vh; }
  .kx-pswitch { display: flex; position: sticky; top: 0; z-index: 40; background: #fff; border-bottom: 1px solid #DDE5EE; }
  .kx-pswitch button { flex: 1; padding: 11px 8px; border: 0; border-bottom: 3px solid transparent; background: #fff; font: 700 13px/1.2 var(--ff); color: #6B7C90; cursor: pointer; }
  .kx-pswitch button.kx-on { color: #0A5E66; border-bottom-color: #0E7C86; }
  .kx-pane-l, .kx-pane-r { padding: 12px 14px; }
  .kx-show-l .kx-pane-r { display: none; }
  .kx-show-r .kx-pane-l { display: none; }
  .kx-hdr-ti h1 { font-size: 15.5px; }
  .kx-tabs { flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; -webkit-overflow-scrolling: touch; padding-bottom: 2px; }
  .kx-tabs::-webkit-scrollbar { display: none; }
  .kx-tabs button { flex: 0 0 auto; white-space: nowrap; }
}

/* ----- left pane: patient ----- */
.kx-pp-tabs { display: flex; gap: 4px; margin: 0 0 8px; }
.kx-pp-tabs button { flex: 1; padding: 6px 8px; border-radius: 7px; border: 1.5px solid #DDE5EE; background: #fff; font: 700 12px/1.2 var(--ff); color: #4A5A6E; cursor: pointer; }
.kx-pp-tabs button.kx-on { border-color: #0E7C86; background: #F0F9FA; color: #0A5E66; }
.kx-pp-sec { border: 1px solid #DDE5EE; border-radius: 10px; padding: 7px 10px 3px; margin: 0 0 7px; background: #fff; }
.kx-pp-h { display: flex; align-items: center; gap: 6px; margin: 0 0 7px; font-size: 10.5px; font-weight: 800; letter-spacing: .07em; color: #0A5E66; text-transform: uppercase; }
.kx-pp-h::before { content: ""; width: 3px; height: 12px; border-radius: 2px; background: #0E7C86; }
.kx-pp-h .kx-pp-sub { margin-left: auto; text-transform: none; letter-spacing: 0; font-size: 11px; font-weight: 800; color: #fff; padding: 1px 8px; border-radius: 999px; }
.kx-f { margin: 0 0 6px; min-width: 0; }
.kx-f-l { font-size: 10px; font-weight: 700; letter-spacing: .04em; color: #6B7C90; text-transform: uppercase; margin: 0 0 3px; }
.kx-r2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.kx-r3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
.kx-num, .kx-txt { width: 100%; box-sizing: border-box; padding: 6px 8px; border: 1.5px solid #DDE5EE; border-radius: 7px; font: 700 13px/1.3 var(--ff); color: #14243B; background: #fff; }
.kx-txt { letter-spacing: .05em; text-transform: uppercase; }
.kx-num::placeholder, .kx-txt::placeholder { color: #A9B6C4; font-weight: 500; letter-spacing: 0; text-transform: none; }
.kx-num:focus-visible, .kx-txt:focus-visible { outline: 2px solid #0E7C86; outline-offset: 1px; }
.kx-unit { position: relative; }
.kx-unit .kx-num { padding-right: 24px; }
.kx-unit span { position: absolute; right: 8px; top: 50%; transform: translateY(-50%); font-size: 11px; font-weight: 700; color: #8798AB; pointer-events: none; }
.kx-seg { display: flex; gap: 2px; background: #EEF3F8; padding: 2px; border-radius: 8px; flex-wrap: wrap; }
.kx-seg-b { flex: 1 1 auto; padding: 5px 6px; border: 0; border-radius: 6px; background: transparent; font: 700 11.5px/1.2 var(--ff); color: #6B7C90; cursor: pointer; white-space: nowrap; }
.kx-seg-b.kx-on { background: #fff; color: #0A5E66; box-shadow: 0 1px 3px rgba(0,0,0,.14); }
.kx-seg-b:focus-visible { outline: 2px solid #0E7C86; outline-offset: 1px; }
.kx-chk { display: flex; align-items: center; gap: 7px; font-size: 12px; line-height: 1.35; color: #4A5A6E; margin: 0 0 5px; cursor: pointer; }
.kx-chk input { margin: 0; }
.kx-chk-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0 10px; }
.kx-pp-btns { display: flex; gap: 6px; margin: 4px 0 0; }
.kx-pp-btns button { flex: 1; padding: 9px 8px; border-radius: 8px; border: none; cursor: pointer; font: 700 12.5px/1.2 var(--ff); background: #14243B; color: #fff; }
.kx-pp-btns button.kx-ghost { background: #fff; color: #14243B; border: 1.5px solid #DDE5EE; flex: 0 0 auto; }
.kx-pp-note { margin: 2px 0 6px; font-size: 11px; line-height: 1.45; color: #6B7C90; }

/* ----- right pane: decision cards ----- */
.kx-dc { background: #fff; border: 1px solid #DDE5EE; border-left: 4px solid #3B6FB0; border-radius: 9px; padding: 10px 12px 9px; margin: 0 0 9px; }
.kx-dc.kx-must { background: #F3F7FD; border-color: #14243B; }
.kx-dc.kx-sel { background: #ECFDF5; border-color: #10B981; }
.kx-dc.kx-bad { background: #FEF2F2; border-color: #FCA5A5; }
.kx-dc.kx-inv { background: #FBFBFD; border-color: #8798AB; border-style: dashed; border-left-style: solid; }
.kx-dc-h { display: flex; gap: 8px; align-items: flex-start; flex-wrap: wrap; margin: 0 0 6px; }
.kx-dc-t { flex: 1; min-width: 180px; font-weight: 700; font-size: 13.5px; line-height: 1.4; color: #14243B; }
.kx-dc.kx-bad .kx-dc-t { color: #991B1B; }
.kx-dc-tier { color: #fff; border-radius: 4px; padding: 2px 8px; font-size: 9.5px; font-weight: 800; white-space: nowrap; }
.kx-dc-tr { margin: 6px 0 0; }
.kx-dc-trow { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; margin: 0 0 4px; }
.kx-dc-des { font-size: 11.5px; color: #4A5A6E; line-height: 1.4; }
.kx-dc-n { margin: 6px 0 6px; font-size: 12px; line-height: 1.5; color: #4A5A6E; }
.kx-dc.kx-bad .kx-dc-n { color: #B91C1C; }
.kx-dc-add { margin-top: 2px; padding: 4px 11px; font: 700 11px/1.2 var(--ff); cursor: pointer; border-radius: 5px; border: 1.5px solid #DDE5EE; background: #fff; color: #4A5A6E; }
.kx-dc-add.kx-on { border-color: #10B981; background: #ECFDF5; color: #065F46; }
.kx-tiles { display: flex; gap: 8px; flex-wrap: wrap; margin: 6px 0 4px; }
.kx-tile { flex: 1 1 120px; min-width: 104px; background: #F5F8FB; border: 1px solid #DDE5EE; border-radius: 8px; padding: 6px 9px 5px; }
.kx-tile-v { font-size: 20px; font-weight: 800; line-height: 1.1; letter-spacing: -.01em; color: #14243B; }
.kx-tile-l { font-size: 10.5px; line-height: 1.3; color: #4A5A6E; margin-top: 2px; }

/* update bars: the colour is the source */
.kx-ub { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 8px; margin: 0 0 6px; padding: 5px 9px; border-left: 4px solid var(--c); border-radius: 6px; background: var(--t); color: var(--i); font-size: 12px; line-height: 1.4; }
.kx-ub-k { flex: 0 0 auto; padding: 1px 7px; border: 1.5px solid var(--c); border-radius: 999px; background: #fff; color: var(--i); font-size: 10.5px; font-weight: 800; letter-spacing: .03em; white-space: nowrap; }
.kx-ub-t { flex: 1 1 200px; font-weight: 600; }
.kx-ub .kx-lk { background: none; border: 0; padding: 0; cursor: pointer; color: var(--i); font: 800 11.5px/1.2 var(--ff); text-decoration: underline; }
.kx-kd { display: inline-block; padding: 1px 7px; border-radius: 4px; font-size: 9.5px; font-weight: 800; letter-spacing: .05em; white-space: nowrap; }
.kx-kd-neg { background: #E1EAF4; color: #002F5D; border: 1px solid #002F5D; }
.kx-kd-inv { background: #fff; color: #4A5A6E; border: 1px dashed #4A5A6E; }

/* legend */
.kx-leg { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 8px; margin: 0 0 10px; padding: 7px 10px; border: 1px solid #DDE5EE; border-radius: 10px; background: #fff; font-size: 12px; }
.kx-leg-h { font-size: 10.5px; font-weight: 800; letter-spacing: .07em; text-transform: uppercase; color: #6B7C90; }
.kx-lc { display: inline-flex; align-items: center; gap: 6px; padding: 3px 9px 3px 7px; border: 1.5px solid var(--c); border-radius: 999px; background: var(--t); color: var(--i); font: 700 11.5px/1.2 var(--ff); cursor: pointer; }
.kx-lc .kx-lc-sw { width: 11px; height: 11px; border-radius: 50%; background: var(--c); display: inline-block; }
.kx-lc b { font-weight: 800; background: #fff; border-radius: 999px; padding: 0 6px; font-size: 11px; }
.kx-lc.kx-off { opacity: .45; background: #fff; text-decoration: line-through; }
.kx-leg .kx-lk { background: none; border: 0; padding: 0; cursor: pointer; color: #0A5E66; font: 800 11.5px/1.2 var(--ff); text-decoration: underline; margin-left: auto; }

/* subtype strip */
.kx-sub-strip { background: #fff; border-radius: 12px; padding: 10px 14px; border: 1px solid #DDE5EE; border-top: 4px solid #7C3AED; margin: 0 0 10px; }
.kx-sub-k { font-size: 10.5px; font-weight: 700; letter-spacing: .05em; color: #8798AB; }
.kx-sub-n { font-size: 20px; font-weight: 800; margin-top: 1px; line-height: 1.2; }
.kx-sub-b { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 6px; }

/* updates tab and update modal */
.kx-uc { border: 1px solid #DDE5EE; border-left: 5px solid var(--c); border-radius: 10px; padding: 10px 14px 10px; margin: 0 0 10px; background: #fff; }
.kx-uc-h { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin: 0 0 4px; }
.kx-uc h3 { margin: 0 0 4px; font-size: 14.5px; font-weight: 800; line-height: 1.35; color: #14243B; }
.kx-uc p { margin: 3px 0; font-size: 12.5px; line-height: 1.55; color: #33465C; }
.kx-uc .kx-ref { font-size: 11.5px; font-style: italic; color: #6B7C90; }
.kx-ap { display: inline-block; padding: 2px 9px; border-radius: 999px; font-size: 11px; font-weight: 800; }
